[package]
name = "vela-transfer-hook"
version = "0.1.0"
description = "Dedicated transfer-hook validator for Vela wrapped USDC"
edition = "2021"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "vela_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "vela-protocol/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["interface-instructions"] }
anchor-spl = "=0.32.1"
vela-protocol = { path = "../vela-protocol", features = ["no-entrypoint"] }
spl-discriminator = "=0.5.2"
spl-transfer-hook-interface = "=2.0.0"
spl-tlv-account-resolution = "0.11.1"
solana-pubkey = "=3.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
