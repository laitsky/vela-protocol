[package]
name = "vela-protocol"
version = "0.2.0"
description = "Created with Anchor"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]
name = "vela_protocol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed", "interface-instructions"] }
anchor-spl = "=0.32.1"
arcium-anchor = "0.9.3"
arcium-macros = "0.9.3"
arcium-client = { version = "0.9.3", default-features = false }
spl-token-2022 = { version = "10.0.0", features = ["no-entrypoint"] }
spl-token-metadata-interface = "0.8.0"
spl-pod = "=0.7.1"
spl-token-group-interface = "=0.7.1"
spl-transfer-hook-interface = "=2.0.0"
spl-discriminator = "=0.5.2"
spl-tlv-account-resolution = "0.11.1"
solana-instruction = "=3.3.0"
solana-program-error = "=3.0.1"
solana-pubkey = "=3.0.0"

[dev-dependencies]
litesvm = "0.10.0"
litesvm-token = "*"
proptest = { workspace = true }
solana-sdk = "*"
solana-address = "=2.5.0"
solana-account = "=3.4.0"
solana-clock = "=3.0.0"
solana-keypair = "=3.1.0"
solana-message = "=3.1.0"
solana-program-pack = "=3.0.0"
solana-signer = "=3.0.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = { version = "=3.1.0", features = ["verify"] }
spl-token = "*"
spl-associated-token-account = "*"
vela-transfer-hook = { path = "../vela-transfer-hook", features = ["no-entrypoint"] }

[build-dependencies]
serde_json = "1"

