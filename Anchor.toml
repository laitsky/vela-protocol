[toolchain]
package_manager = "bun"

[features]
resolution = true
# Anchor 0.32 falsely flags the dedicated hook program's foreign-PDA CHECK docs.
# Keep the default build path working; safety is still enforced by runtime account validation.
skip-lint = true

[programs.localnet]
vela_protocol = "BhgXzh4E6e9xsgNrsPf9q1JqXKxETxjc9LBqx3D8cAKC"
vela_transfer_hook = "93q91TJ6M9yGoehAeeCttgEc1SThFGXaw4rZS2ysr3uX"

[programs.devnet]
vela_protocol = "BhgXzh4E6e9xsgNrsPf9q1JqXKxETxjc9LBqx3D8cAKC"
vela_transfer_hook = "93q91TJ6M9yGoehAeeCttgEc1SThFGXaw4rZS2ysr3uX"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[test]
# Anchor test deploys use the provider wallet as the upgrade authority for both
# vela_protocol and vela_transfer_hook when upgradeable = true.
upgradeable = true

[scripts]
test = "bun test"
